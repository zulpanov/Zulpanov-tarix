name: Javob kalitlari (server tekshiruvi uchun)
on:
  push:
    branches: [main]
    paths: ["index.html", "data/tests.js", "ms11.js", "tools/build_key.py", ".github/workflows/key.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: key, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python tools/build_key.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A data/key
          if git diff --cached --quiet; then echo "Kalitlar o'zgarmagan"; exit 0; fi
          git commit -qm "Javob kalitlari yangilandi"
          git pull -q --rebase origin main && git push -q origin HEAD:main
