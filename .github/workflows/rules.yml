name: Firebase qoidalarini joylash
on:
  push:
    branches: [main]
    paths: ["database.rules.json", "tools/deploy_rules.js", ".github/workflows/rules.yml"]
  workflow_dispatch:
concurrency: rules-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kalitni tekshirish
        id: chk
        env:
          S: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -n "$S" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::FIREBASE_SA sirri qo'shilmagan — qoidalar joylanmadi"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == '1'
        with: { node-version: 20 }
      - name: Joylash
        if: steps.chk.outputs.ok == '1'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: npm i --no-save google-auth-library@9 >/dev/null 2>&1 && node tools/deploy_rules.js
