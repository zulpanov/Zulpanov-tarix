name: Domen (Cloudflare DNS)
on:
  push:
    branches: [main]
    paths: [".github/workflows/domain.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare zona va DNS yozuvlari
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D: tarixarena.uz
        run: |
          set +e
          api(){ curl -s -X "$1" "https://api.cloudflare.com/client/v4$2" -H "Authorization: Bearer $T" -H "Content-Type: application/json" ${3:+--data "$3"}; }
          {
          echo "== token tekshiruvi"; api GET /user/tokens/verify | jq -c '{success,errors,status:.result.status}'
          Z=$(api GET "/zones?name=$D" | jq -r '.result[0].id // empty')
          echo "== hisoblar"; api GET /accounts | jq -c '[.result[]? | {id,name}], .errors'
          A2=$(api GET /accounts | jq -r '.result[0].id // empty'); [ -n "$A2" ] && A=$A2
          if [ -z "$Z" ]; then
            echo "== zona yaratish"; R=$(api POST /zones "{\"name\":\"$D\",\"account\":{\"id\":\"$A\"},\"type\":\"full\"}")
            echo "$R" | jq -c '{success,errors}'; Z=$(echo "$R" | jq -r '.result.id // empty')
          fi
          echo "ZONE=$Z"
          if [ -n "$Z" ]; then
            echo "== nameserverlar"; api GET "/zones/$Z" | jq -r '.result.name_servers[]?, "status: " + (.result.status // "?")'
            EX=$(api GET "/zones/$Z/dns_records?per_page=100" | jq -r '.result[]? | .type+" "+.name+" "+.content')
            echo "== mavjud yozuvlar"; echo "$EX"
            for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
              echo "$EX" | grep -q "^A $D $ip$" || api POST "/zones/$Z/dns_records" "{\"type\":\"A\",\"name\":\"$D\",\"content\":\"$ip\",\"proxied\":false,\"ttl\":1}" | jq -c '{success,errors}'
            done
            echo "$EX" | grep -q "^CNAME www.$D " || api POST "/zones/$Z/dns_records" "{\"type\":\"CNAME\",\"name\":\"www\",\"content\":\"zulpanov.github.io\",\"proxied\":false,\"ttl\":1}" | jq -c '{success,errors}'
            echo "== sozlamalar (avval SSL Full, keyin proksi)"
            SSL=$(api PATCH "/zones/$Z/settings/ssl" '{"value":"full"}' | jq -r '.success'); echo "ssl=full: $SSL"
            for kv in 'always_use_https:"on"' 'brotli:"on"' 'http3:"on"' 'early_hints:"on"' 'min_tls_version:"1.2"' 'rocket_loader:"off"'; do k=${kv%%:*}; v=${kv#*:}; echo "$k: $(api PATCH "/zones/$Z/settings/$k" "{\"value\":$v}" | jq -c '[.success,.errors[0].message]')"; done
            if [ "$SSL" = "true" ]; then
              echo "== proksi (to'q sariq bulut)"
              api GET "/zones/$Z/dns_records?per_page=100" | jq -r '.result[]? | select((.type=="A" or .type=="CNAME") and .proxied==false) | .id' | while read id; do api PATCH "/zones/$Z/dns_records/$id" '{"proxied":true}' | jq -c '{success,errors}'; done
            else echo "SSL o'rnatilmadi — proksi yoqilmadi (token huquqi yetarli emas)"; fi
            echo "== natija"; api GET "/zones/$Z/dns_records?per_page=100" | jq -r '.result[]? | .type+" "+.name+" "+.content+" proxied="+(.proxied|tostring)'
            echo "== ssl hozir: $(api GET "/zones/$Z/settings/ssl" | jq -r '.result.value // .errors[0].message')"
          fi
          echo "== zona holati"; api GET "/zones/$Z" | jq -r '.result.status // "?"'
          echo "== jahon DNS (1.1.1.1 / 8.8.8.8)"
          for r in 1.1.1.1 8.8.8.8; do echo "-- $r NS: $(dig +short NS $D @$r | tr '\n' ' ') | A: $(dig +short A $D @$r | tr '\n' ' ') | www: $(dig +short CNAME www.$D @$r)"; done
          echo "-- brian (CF) A: $(dig +short A $D @brian.ns.cloudflare.com | tr '\n' ' ') | www: $(dig +short CNAME www.$D @brian.ns.cloudflare.com)"
          echo "-- .uz registri NS: $(dig +short NS $D @ns.cctld.uz 2>/dev/null | tr '\n' ' ') $(dig +norecurse NS $D @$(dig +short NS uz | head -1) | grep -A3 AUTHORITY | tail -2 | tr '\n' ' ')"
          echo "-- rdns1 javobi: $(dig +short A $D @rdns1.ahost.uz 2>&1 | head -3 | tr '\n' ' ') status: $(dig A $D @rdns1.ahost.uz | grep -o 'status: [A-Z]*')"
          echo "-- registr NS (to'liq): $(dig +norecurse NS $D @$(dig +short NS uz | head -1) | grep -E '\sNS\s' | awk '{print $5}' | tr '\n' ' ')"
          echo "-- 1.1.1.1 status: $(dig A $D @1.1.1.1 | grep -o 'status: [A-Z]*')"
          echo "== bot setup"; SUB=$(api GET "/accounts/$A/workers/subdomain" | jq -r '.result.subdomain // empty'); echo "sub=$SUB"
          [ -n "$SUB" ] && curl -s -m 30 "https://zulpanov-tarix-bot.$SUB.workers.dev/?setup=1" | head -c 400; echo
          echo "== sayt"; curl -sI -m 20 https://tarixarena.uz/ | head -3; curl -sI -m 20 https://zulpanov.github.io/Zulpanov-tarix/ | grep -i "^HTTP\|^location"
          } > dns.txt 2>&1
          cat dns.txt
      - name: Natijani dns-log shoxiga yozish
        run: |
          mkdir out && mv dns.txt out/ && cd out
          git init -q && git checkout -q -b dns-log
          git -c user.name=bot -c user.email=bot@x add dns.txt && git -c user.name=bot -c user.email=bot@x commit -qm log
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dns-log
