<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Xarita o‘yini · ZULPANOV METHODS TARIX</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0A0720;--card:#141033;--card2:#1c1745;--line:#2e2768;--tx:#EDEBFF;--mu:#A7A3D6;--ac:#8B5CF6;--ac2:#22D3EE;--ok:#22C55E;--bad:#F43F5E;--gold:#FBBF24;--gr:linear-gradient(135deg,#7C3AED,#06B6D4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);min-height:100vh;line-height:1.45;background:radial-gradient(1200px 600px at 110% -10%,rgba(139,92,246,.13),transparent 60%),radial-gradient(900px 500px at -20% 10%,rgba(47,165,154,.12),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 14px;font:600 14px Inter,sans-serif;cursor:pointer;transition:transform .15s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--gr);border:0;color:#fff}
h1{font:800 20px Poppins,sans-serif;letter-spacing:.02em}
.sub{color:var(--mu);font-size:14px}
.hero{border:1px solid var(--line);border-radius:22px;padding:18px;background:linear-gradient(145deg,#1f1950,var(--card));margin-bottom:14px}
.hero h1{font-size:24px;margin-bottom:4px}
.seg{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--card2);color:var(--mu);border-radius:12px;padding:8px;font:600 13px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--gr);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{position:relative;text-align:left;border:1px solid var(--line);border-radius:20px;padding:14px;background:linear-gradient(145deg,#1f1950,var(--card));color:var(--tx);cursor:pointer;overflow:hidden;animation:up .4s both;font-family:inherit}
.cc .em{font-size:30px;line-height:1}
.cc b{display:block;font:700 15px Poppins,sans-serif;margin-top:8px}
.cc span{color:var(--mu);font-size:12px}
.cc .best{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;color:var(--gold);background:#fbbf2422;border-radius:10px;padding:2px 7px}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.bar{flex:1;height:8px;border-radius:8px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gr);transition:width .4s}
.mapbox{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0d2a4a}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
svg path{stroke:#0d2a4a;stroke-width:.7;vector-effect:non-scaling-stroke}
.l0{fill:#2b2f52}.l1{fill:#3d4479}
.tg{fill:var(--gold);filter:drop-shadow(0 0 6px #fbbf24aa)}
.tg.okc{fill:var(--ok);filter:drop-shadow(0 0 6px #22c55eaa)}
.tg.badc{fill:var(--bad);filter:drop-shadow(0 0 6px #f43f5eaa)}
.ring{fill:none;stroke:var(--gold);stroke-width:2.5;vector-effect:non-scaling-stroke;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.lbl{font-family:Inter,sans-serif;font-weight:800;fill:#fff;paint-order:stroke;stroke:#000;text-anchor:middle}
.tools{display:flex;gap:8px;margin:10px 0}
.tools .btn{flex:1;font-size:13px;padding:9px}
.tools .btn.used{opacity:.55}
.hint{min-height:20px;text-align:center;color:var(--ac2);font-weight:700;font-size:14px;margin-bottom:8px}
.q{font:700 16px Poppins,sans-serif;text-align:center;margin:4px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.op{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:13px 10px;font:600 14px Inter,sans-serif;cursor:pointer;min-height:52px;transition:all .2s}
.op.ok{background:#22c55e26;border-color:var(--ok);color:#bbf7d0}
.op.bad{background:#f43f5e26;border-color:var(--bad);color:#fecdd3}
.op:disabled{cursor:default}
.fb{margin-top:10px;border-radius:16px;padding:12px 14px;display:none;animation:up .3s both}
.fb.show{display:block}
.fb.ok{background:#22c55e1c;border:1px solid #22c55e66}
.fb.bad{background:#f43f5e1c;border:1px solid #f43f5e66}
.fb .ph{font:800 18px Poppins,sans-serif}
.fb .ex{color:var(--tx);font-size:14px;margin-top:2px}
.next{width:100%;margin-top:10px;padding:13px;font-size:15px;display:none}
.pop{position:fixed;left:50%;top:30%;width:92vw;max-width:520px;text-align:center;transform:translate(-50%,-50%) scale(.6);font:800 28px/1.2 Poppins,sans-serif;pointer-events:none;opacity:0;text-shadow:0 3px 14px #000,0 0 2px #000;z-index:9}
.pop.go{animation:pop 1.1s ease-out}
@keyframes pop{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.res{text-align:center}
.res .big{font:800 46px Poppins,sans-serif;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.res .ph{font:800 22px Poppins,sans-serif;margin:6px 0}
.mist{margin-top:14px;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px 14px}
.mist div{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.mist div:last-child{border:0}
.mist small{color:var(--mu)}
.row{display:flex;gap:8px;margin-top:12px}.row .btn{flex:1;padding:13px}
.hide{display:none!important}
.loading{text-align:center;color:var(--mu);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="btn" id="back">← Orqaga</button><h1>🗺️ Xarita o‘yini</h1></div>

  <div id="menu">
    <div class="hero">
      <h1>Davlatni xaritadan top!</h1>
      <div class="sub">Xaritada bitta davlat belgilanadi — uning nomini 4 ta variantdan toping. Qiynalsangiz 🔍 yaqinlashtiring yoki 💡 poytaxtini oching (ochilsa ball yarmiga tushadi).</div>
      <div class="seg" id="cnt"><button data-n="10" class="on">10 ta savol</button><button data-n="20">20 ta</button><button data-n="0">Hammasi</button></div>
    </div>
    <div class="grid" id="conts"><div class="loading">Xarita yuklanmoqda…</div></div>
  </div>

  <div id="game" class="hide">
    <div class="hud"><span class="pill" id="hN">1/10</span><div class="bar"><i id="hB"></i></div><span class="pill" id="hS">⭐ 0</span><span class="pill" id="hK">🔥 0</span></div>
    <div class="mapbox"><svg id="map" viewBox="0 0 1000 760"></svg></div>
    <div class="tools"><button class="btn" id="zoom">🔍 Yaqinlashtirish</button><button class="btn" id="hintB">💡 Poytaxti</button></div>
    <div class="hint" id="hint"></div>
    <div class="q">Belgilangan davlat qaysi?</div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"><div class="ph" id="fbP"></div><div class="ex" id="fbE"></div></div>
    <button class="btn pri next" id="next">Keyingisi →</button>
  </div>

  <div id="res" class="hide res">
    <div class="hero">
      <div class="sub" id="rC"></div>
      <div class="big" id="rB"></div>
      <div class="ph" id="rP"></div>
      <div class="sub" id="rS"></div>
    </div>
    <div class="mist hide" id="rM"></div>
    <div class="row"><button class="btn pri" id="again">🔁 Yana o‘ynash</button><button class="btn" id="fix">🛠 Xatolar ustida</button></div>
    <div class="row"><button class="btn" id="toMenu">🌍 Boshqa qit’a</button></div>
  </div>
</div>
<div class="pop" id="pop"></div>

<script>
const TG=window.Telegram&&Telegram.WebApp;try{if(TG&&TG.initData){TG.ready();TG.expand()}}catch(e){}
const $=id=>document.getElementById(id);
const PRAISE=["Malades!","Oo ana!","Senga yetadigani yo‘q!","A+ olasan bu ketishda!","Bomba!","Kuchayding sen!","Ofarin!","Krasavchik!","Legenda!"];
const FAIL=["Afsus, keyingisida topasan","Dunyo seni tog‘angmas!","O‘qidingmi o‘zi?","Xato qilib charchamadingmi?","Obbo, bu nima ahvol?","Xaritaga yaxshilab qara-da!","Bunaqasi ketmaydi, uka!","Ee, shuni ham bilmaysanmi?"];
const EMO={E:"🏰",A:"🏯",F:"🦁",N:"🗽",S:"🦜",O:"🦘"};
const ORDER=["E","A","F","N","S","O"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const HINT={"Isroil":"Yirik shaharlari: Quddus, Tel-Aviv"};
let N=10,K=null,list=[],i=0,score=0,streak=0,bestStreak=0,right=0,usedHint=false,zoomed=false,mist=[],answered=false;

// tovush (Web Audio) va tebranish
let AC=null;function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[523,659,784]:[220,175]).forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;g.gain.setValueAtTime(.0001,t+k*.09);g.gain.exponentialRampToValueAtTime(.18,t+k*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+k*.09+.22);o.connect(g).connect(AC.destination);o.start(t+k*.09);o.stop(t+k*.09+.25)})}catch(e){}
  try{TG&&TG.HapticFeedback&&TG.HapticFeedback.notificationOccurred(ok?"success":"error")}catch(e){}}

function back(){if(!$("game").classList.contains("hide")||!$("res").classList.contains("hide")){show("menu");return}location.href="index.html"}
$("back").onclick=back;
try{if(TG&&TG.BackButton&&TG.initData){TG.BackButton.show();TG.BackButton.onClick(back)}}catch(e){}

function show(id){["menu","game","res"].forEach(x=>$(x).classList.toggle("hide",x!==id));window.scrollTo(0,0);if(id==="menu")renderMenu()}

document.querySelectorAll("#cnt button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#cnt button").forEach(x=>x.classList.toggle("on",x===b));N=+b.dataset.n;LS.set("zm_xmap_n",N)});
(()=>{const s=LS.get("zm_xmap_n",10);const b=document.querySelector(`#cnt button[data-n="${s}"]`);if(b)b.click()})();

function renderMenu(){if(typeof XMAP==="undefined")return;const g=$("conts");g.innerHTML="";
  ORDER.forEach((k,ix)=>{const c=XMAP[k],best=LS.get("zm_xmap_best_"+k,null);
    const b=document.createElement("button");b.className="cc";b.style.animationDelay=ix*60+"ms";
    b.innerHTML=`${best!=null?`<span class="best">🏆 ${best}%</span>`:""}<div class="em">${EMO[k]}</div><b>${E(c.n)}</b><span>${c.q.length} ta davlat</span>`;
    b.onclick=()=>start(k);g.appendChild(b)})}

function start(k,only){K=k;const all=XMAP[k].q.map((q,ix)=>ix);
  list=only&&only.length?shuf(only):shuf(all).slice(0,N||all.length);
  i=0;score=0;streak=0;bestStreak=0;right=0;mist=[];show("game");drawBase();ask()}

function drawBase(){const c=XMAP[K];let h="";
  c.s.forEach(([d,q],ix)=>{h+=`<path id="p${ix}" class="${q===undefined?"l0":"l1"}" d="${d}"${q!==undefined?` data-q="${q}"`:""}/>`});
  h+=`<g id="ov"></g>`;$("map").innerHTML=h;$("map").setAttribute("viewBox","0 0 1000 760")}

function nearOpts(t){const c=XMAP[K].q,T=c[t];
  const d=c.map((q,ix)=>[ix,Math.hypot(q.x-T.x,q.y-T.y)]).filter(([ix])=>ix!==t&&c[ix].n!==T.n).sort((a,b)=>a[1]-b[1]);
  const near=shuf(d.slice(0,7).map(x=>x[0])).slice(0,2),rest=shuf(d.slice(7).map(x=>x[0])).filter(x=>!near.includes(x));
  return shuf([t,...near,rest[0]??d[2][0]])}

let VB=[0,0,1000,760],TVB=VB,anim=null;
function setVB(to,ms=450){TVB=to;const fr=VB.slice(),t0=performance.now();cancelAnimationFrame(anim);
  const st=now=>{let p=Math.min(1,(now-t0)/ms);p=1-Math.pow(1-p,3);VB=fr.map((v,j)=>v+(to[j]-v)*p);$("map").setAttribute("viewBox",VB.map(v=>v.toFixed(1)).join(" "));if(p<1)anim=requestAnimationFrame(st)};anim=requestAnimationFrame(st)}
function zoomTo(q){let [x0,y0,x1,y1]=q.b;let w=Math.max(x1-x0,70)*3,h=Math.max(y1-y0,54)*3;if(w/h>1000/760)h=w*760/1000;else w=h*1000/760;
  w=Math.min(w,1000);h=Math.min(h,760);let cx=(x0+x1)/2,cy=(y0+y1)/2;if(q.big<4000){cx=q.x;cy=q.y}
  let x=Math.max(0,Math.min(1000-w,cx-w/2)),y=Math.max(0,Math.min(760-h,cy-h/2));setVB([x,y,w,h])}

function ask(){answered=false;usedHint=false;zoomed=false;const t=list[i],c=XMAP[K],q=c.q[t];
  $("hN").textContent=`${i+1}/${list.length}`;$("hB").style.width=(i/list.length*100)+"%";$("hS").textContent="⭐ "+score;$("hK").textContent="🔥 "+streak;
  document.querySelectorAll("#map path.tg").forEach(p=>p.setAttribute("class","l1"));
  document.querySelectorAll(`#map path[data-q="${t}"]`).forEach(p=>{p.setAttribute("class","tg");p.parentNode.insertBefore(p,$("ov"))});
  const small=Math.max(q.b[2]-q.b[0],q.b[3]-q.b[1])<36;
  $("ov").innerHTML=small?`<circle class="ring" cx="${q.x}" cy="${q.y}" r="22"/>`:"";
  setVB([0,0,1000,760],small?0:300);
  $("hint").textContent="";$("hintB").classList.remove("used");$("zoom").classList.remove("used");$("zoom").textContent="🔍 Yaqinlashtirish";
  $("fb").className="fb";$("next").style.display="none";
  const o=$("opts");o.innerHTML="";nearOpts(t).forEach(ix=>{const b=document.createElement("button");b.className="op";b.textContent=c.q[ix].n;b.onclick=()=>answer(ix,b);o.appendChild(b)})}

$("zoom").onclick=()=>{const q=XMAP[K].q[list[i]];zoomed=!zoomed;if(zoomed){zoomTo(q);$("zoom").textContent="🗺 Butun xarita"}else{setVB([0,0,1000,760]);$("zoom").textContent="🔍 Yaqinlashtirish"}};
$("hintB").onclick=()=>{if(answered||usedHint)return;usedHint=true;const q=XMAP[K].q[list[i]];$("hint").textContent=HINT[q.n]||("Poytaxti: "+q.c);$("hintB").classList.add("used")};

function answer(ix,btn){if(answered)return;answered=true;const t=list[i],c=XMAP[K],q=c.q[t],ok=ix===t;
  document.querySelectorAll(".op").forEach(b=>{b.disabled=true;if(b.textContent===q.n)b.classList.add("ok")});
  if(!ok)btn.classList.add("bad");
  document.querySelectorAll(`#map path[data-q="${t}"]`).forEach(p=>p.setAttribute("class","tg "+(ok?"okc":"badc")));
  const fs=Math.max(10,TVB[2]*0.042);$("ov").innerHTML+=`<text class="lbl" x="${q.x}" y="${q.y-fs*0.6}" font-size="${fs.toFixed(1)}" stroke-width="${(fs/5).toFixed(1)}">${E(q.n)}</text>`;
  let ph;
  if(ok){right++;streak++;bestStreak=Math.max(bestStreak,streak);const pts=(usedHint?5:10)+(streak>=3?2:0);score+=pts;
    ph=pick(PRAISE);if(streak>=3)ph+=` 🔥${streak}`;popup(ph,"#4ade80");$("fbP").textContent="✅ "+ph+` +${pts}`}
  else{streak=0;mist.push(t);ph=pick(FAIL);popup(ph,"#fb7185");$("fbP").textContent="❌ "+ph}
  const cap=HINT[q.n]?HINT[q.n].replace("Yirik shaharlari","yirik shaharlari"):`poytaxti — ${q.c}`;
  $("fbE").innerHTML=`Bu — <b>${E(q.n)}</b>, ${E(cap)}.`;
  $("fb").className="fb show "+(ok?"ok":"bad");beep(ok);
  $("hS").textContent="⭐ "+score;$("hK").textContent="🔥 "+streak;
  $("next").textContent=i+1<list.length?"Keyingisi →":"Natijani ko‘rish 🏁";$("next").style.display="block"}
$("next").onclick=()=>{i++;if(i<list.length)ask();else finish()};

function popup(t,col){const p=$("pop");p.textContent=t;p.style.color=col;p.classList.remove("go");void p.offsetWidth;p.classList.add("go")}

function finish(){const pc=Math.round(right/list.length*100),c=XMAP[K];
  const k="zm_xmap_best_"+K,b=LS.get(k,null);if(b==null||pc>b)LS.set(k,pc);
  $("rC").textContent=`${EMO[K]} ${c.n} · ${list.length} ta savol`;
  $("rB").textContent=`${right}/${list.length}`;
  $("rP").textContent=pc>=90?"🏆 Legenda! A+ sizniki!":pc>=70?"💪 Krasavchik! Yana ozgina — a’lo!":pc>=50?"🙂 Yomon emas, lekin xaritani yana bir ko‘r":"😬 Obbo… xaritani qayta o‘qib chiq!";
  $("rS").textContent=`⭐ ${score} ball · eng uzun seriya 🔥 ${bestStreak} · ${pc}%`+(b!=null&&pc>b?" · yangi rekord!":"");
  const m=$("rM");if(mist.length){m.innerHTML=`<b>📌 Takrorlash uchun:</b>`+mist.map(t=>{const q=c.q[t];return `<div>${E(q.n)} <small>— ${E(HINT[q.n]||"poytaxti "+q.c)}</small></div>`}).join("");m.classList.remove("hide");$("fix").classList.remove("hide")}
  else{m.classList.add("hide");$("fix").classList.add("hide")}
  $("hB").style.width="100%";show("res");if(pc>=70)beep(true)}
$("again").onclick=()=>start(K);$("fix").onclick=()=>start(K,mist.slice());$("toMenu").onclick=()=>show("menu");

const s=document.createElement("script");s.src="xmap-data.js?v=1";s.onload=renderMenu;s.onerror=()=>{$("conts").innerHTML='<div class="loading">Xaritani yuklab bo‘lmadi. Internetni tekshiring.</div>'};document.body.appendChild(s);
</script>
</body>
</html>
